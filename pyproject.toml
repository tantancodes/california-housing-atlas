[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "california-housing-atlas"
version = "0.1.0"
description = "Auditable housing analytics: CRMLS workflow and public California county exploration"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "numpy>=2,<3", "streamlit>=1.40,<2", "plotly>=6,<7", "geopandas>=1,<2", "pyarrow>=14,<25"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
sql = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
housing-atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
atlas = ["*.css"]
